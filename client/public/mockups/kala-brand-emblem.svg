<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="phoenix-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D94700" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA033" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D94700" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="phoenix-wings" filter="url(#glow)">
    <!-- Phoenix Head & Crown -->
    <path d="M 200 45 L 208 30 L 200 15 L 192 30 Z" fill="#FFA033" />
    <path d="M 200 48 C 205 38 215 32 210 24 C 205 30 195 30 190 24 C 185 32 195 38 200 48 Z" fill="#FF6B00" />
    <circle cx="197" cy="38" r="1.5" fill="#FFFFFF" />
    <circle cx="203" cy="38" r="1.5" fill="#FFFFFF" />

    <!-- Left Wing (Spread Outward) -->
    <path d="M 188 52 C 160 48 115 30 80 50 C 105 60 140 68 165 72 C 140 76 100 70 70 85 C 95 95 130 98 160 98 C 135 106 105 110 85 125 C 110 130 140 125 168 118 C 150 128 125 142 110 160 C 135 155 160 142 178 130 C 170 142 155 160 145 178 C 165 168 182 150 192 135 L 195 90 Z" fill="url(#phoenix-grad)" />

    <!-- Right Wing (Spread Outward Symmetric) -->
    <path d="M 212 52 C 240 48 285 30 320 50 C 295 60 260 68 235 72 C 260 76 300 70 330 85 C 305 95 270 98 240 98 C 265 106 295 110 315 125 C 290 130 260 125 232 118 C 250 128 275 142 290 160 C 265 155 240 142 222 130 C 230 142 245 160 255 178 C 235 168 218 150 208 135 L 205 90 Z" fill="url(#phoenix-grad)" />

    <!-- Torso & Tail Feathers -->
    <path d="M 195 90 C 190 115 185 145 175 170 C 190 160 200 155 200 175 C 200 155 210 160 225 170 C 215 145 210 115 205 90 Z" fill="#D94700" />
    <path d="M 194 105 L 200 80 L 206 105 L 200 135 Z" fill="#FFA033" />
  </g>

  <!-- KALA Streetwear Bold Typography -->
  <g id="kala-text">
    <!-- Bold Distressed Text -->
    <text
      x="200"
      y="255"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="'Impact', 'Arial Black', -apple-system, sans-serif"
      font-size="82"
      font-weight="900"
      letter-spacing="4"
      stroke="#111111"
      stroke-width="3"
    >
      KALA
    </text>

    <!-- Streetwear Orange Brush Underline / Slash -->
    <path d="M 110 270 C 150 266 220 264 290 272 C 260 278 180 276 110 270 Z" fill="#D94700" />
    <path d="M 150 275 C 190 272 240 273 285 280 C 250 282 200 280 150 275 Z" fill="#FF6B00" opacity="0.85" />
  </g>
</svg>
